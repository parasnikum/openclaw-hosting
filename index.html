<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenClaw | Neural Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --accent: #ff3e3e; 
      --font-display: 'Outfit', sans-serif;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body { background-color: #030303; color: #fafafa; font-family: var(--font-sans); overflow-x: hidden; }
    h1, h2, h3 { font-family: var(--font-display); }

    /* Enforced Dark Elements */
    input, select, option {
      background-color: #111 !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      outline: none !important;
      border-radius: 8px !important;
      font-size: 13px !important;
      appearance: none;
    }
    input:focus, select:focus { border-color: var(--accent) !important; background-color: #181818 !important; }

    /* Compact Product Card */
    .model-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .model-card:hover { border-color: var(--accent); background: rgba(255, 62, 62, 0.03); }

    /* Mobile Sticky Control Bar */
    @media (max-width: 1023px) {
      .mobile-sticky-controls {
        position: sticky;
        top: 64px;
        z-index: 80;
        background: rgba(3, 3, 3, 0.9);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding: 12px;
      }
    }

    .nav-blur { backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.8); }
    .mono { font-family: var(--font-mono); font-size: 0.75rem; }
    
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(200%);
      background: #fff; color: #000; padding: 0.6rem 1.5rem; border-radius: 40px;
      font-weight: 800; font-size: 0.7rem; transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
      z-index: 10000; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Sort Direction Rotation */
    .sort-icon { transition: transform 0.3s ease; }
    .desc { transform: rotate(180deg); }
  </style>
</head>
<body class="antialiased selection:bg-red-600">

  <div id="toast">SIGNAL CAPTURED</div>

  <nav class="fixed top-0 w-full z-[100] border-b border-white/5 nav-blur h-16 flex items-center">
    <div class="max-w-[1600px] mx-auto px-5 w-full flex items-center justify-between">
      <span class="text-2xl font-black text-red-600 tracking-tighter italic uppercase">OpenClaw</span>
      <a href="https://github.com" target="_blank" class="text-white/40 hover:text-red-500 transition-colors">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-10.886 0-6.627-5.373-12-12-12z"/></svg>
      </a>
    </div>
  </nav>

  <section class="pt-32 pb-12 px-6 border-b border-white/5">
    <div class="max-w-[1600px] mx-auto text-center md:text-left">
      <h1 class="text-5xl md:text-8xl font-black mb-2 tracking-tighter uppercase italic leading-none">Control<br><span class="text-white/10 uppercase">Plane.</span></h1>
      <p class="text-gray-500 text-xs md:text-sm uppercase tracking-widest font-bold">Bridging 700+ Neural Endpoints</p>
    </div>
  </section>

  <div class="mobile-sticky-controls lg:hidden">
    <div class="flex flex-col gap-3">
      <div class="flex gap-2">
        <input type="text" id="searchInputMobile" placeholder="Search..." class="flex-1 px-4 py-2 bg-[#111]">
        <div class="flex items-center gap-3 px-3 border border-white/5 rounded-lg bg-[#111]">
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="textFilterMobile" class="w-3.5 h-3.5 accent-red-600" checked><span class="text-[9px] font-bold text-gray-500 uppercase">T</span></label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="imageFilterMobile" class="w-3.5 h-3.5 accent-red-600"><span class="text-[9px] font-bold text-gray-500 uppercase">V</span></label>
        </div>
      </div>
      <div class="flex gap-2">
        <select id="sortSelectMobile" class="flex-1 py-2 px-3">
          <option value="name">Alphabetical</option>
          <option value="context">Context Win</option>
          <option value="provider">Provider</option>
        </select>
        <button onclick="toggleSortOrder()" class="w-10 flex items-center justify-center bg-[#111] border border-white/10 rounded-lg">
          <svg id="sortIconMobile" class="w-4 h-4 text-red-600 sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
        </button>
        <select id="providerFilterMobile" class="flex-1 py-2 px-3">
          <option value="">All Origins</option>
        </select>
      </div>
    </div>
  </div>

  <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row min-h-screen">
    
    <aside class="hidden lg:flex w-80 sticky top-16 h-[calc(100vh-64px)] p-8 border-r border-white/5 bg-[#080808] flex-col gap-10">
      <div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-4 italic">System Telemetry</p>
        <div id="stats" class="space-y-3"></div>
      </div>

      <div class="space-y-6">
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-3 italic">Search Node</label>
          <input id="searchInput" type="text" placeholder="Search..." class="w-full px-4 py-4">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-3 italic">Sort Intelligence</label>
          <div class="flex gap-2">
            <select id="sortSelect" class="flex-1 px-4 py-4">
              <option value="name">Alphabetical</option>
              <option value="context">Context Window</option>
              <option value="provider">Origin Provider</option>
            </select>
            <button onclick="toggleSortOrder()" class="p-4 bg-[#111] border border-white/10 rounded-xl hover:text-red-500 transition-colors">
              <svg id="sortIcon" class="w-4 h-4 sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-3 italic">Architecture</label>
          <select id="providerFilter" class="w-full px-4 py-4 uppercase">
            <option value="">ALL_PROVIDERS</option>
          </select>
        </div>

        <div class="pt-6 border-t border-white/5 space-y-4">
          <label class="flex items-center justify-between cursor-pointer group">
            <span class="text-xs font-medium text-gray-500 group-hover:text-red-500 transition-colors uppercase">Text Nodes</span>
            <input type="checkbox" id="textFilter" class="w-4 h-4 accent-red-600 bg-transparent" checked>
          </label>
          <label class="flex items-center justify-between cursor-pointer group">
            <span class="text-xs font-medium text-gray-500 group-hover:text-red-500 transition-colors uppercase">Vision Modality</span>
            <input type="checkbox" id="imageFilter" class="w-4 h-4 accent-red-600 bg-transparent">
          </label>
        </div>
      </div>
    </aside>

    <main id="explorer" class="flex-1 p-5 lg:p-12">
      <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-6">
        <div id="pageInfo" class="text-xs font-bold text-gray-600 uppercase tracking-widest"></div>
        <div id="paginationDots" class="flex gap-1.5 overflow-x-auto max-w-full pb-2 no-scrollbar"></div>
      </div>

      <div id="modelList" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3 lg:gap-4 min-h-[600px]"></div>

      <footer class="mt-40 pt-16 border-t border-white/5 flex flex-col md:flex-row items-center justify-between gap-8 pb-10">
        <div class="text-left">
          <p class="text-2xl font-black text-red-600 mb-1 tracking-tighter italic">OpenClaw</p>
          <p class="text-xs text-gray-500 font-medium uppercase tracking-widest">Designed for the Developers <span class="text-red-500">♥</span></p>
        </div>
        <div class="flex gap-10 text-gray-600 text-[10px] uppercase font-bold tracking-widest">
          <a href="#" class="hover:text-white transition-colors">Documentation</a>
          <a href="#" class="hover:text-white transition-colors">Privacy</a>
        </div>
      </footer>
    </main>
  </div>

  <script>
    let allModels = [];
    let filteredModels = [];
    let currentPage = 1;
    let sortAsc = true;
    const itemsPerPage = 25;

    const UI = {
      list: document.getElementById("modelList"),
      provider: [document.getElementById("providerFilter"), document.getElementById("providerFilterMobile")],
      search: [document.getElementById("searchInput"), document.getElementById("searchInputMobile")],
      sort: [document.getElementById("sortSelect"), document.getElementById("sortSelectMobile")],
      text: [document.getElementById("textFilter"), document.getElementById("textFilterMobile")],
      image: [document.getElementById("imageFilter"), document.getElementById("imageFilterMobile")],
      pageInfo: document.getElementById("pageInfo"),
      stats: document.getElementById("stats"),
      dots: document.getElementById("paginationDots")
    };

    function copyId(id) {
      navigator.clipboard.writeText(id).then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
    }

    function toggleSortOrder() {
      sortAsc = !sortAsc;
      document.querySelectorAll('.sort-icon').forEach(i => i.classList.toggle('desc', !sortAsc));
      applyFilters();
    }

    async function fetchData() {
      UI.list.innerHTML = `<div class="col-span-full py-40 flex justify-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-red-600"></div></div>`;
      try {
        allModels = Array.from({length: 689}, (_, i) => ({
            id: i % 3 === 0 ? `anthropic.claude-v${i}` : (i % 3 === 1 ? `openai.gpt-v${i}` : `meta.llama-v${i}`),
            name: i % 3 === 0 ? `Claude ${i}` : (i % 3 === 1 ? `GPT Logic ${i}` : `Llama Node ${i}`),
            provider: i % 3 === 0 ? "anthropic" : (i % 3 === 1 ? "openai" : "meta"),
            contextWindow: 100000 + (Math.floor(Math.random() * 200000)),
            reasoning: i % 12 === 0,
            input: i % 5 === 0 ? ["text", "image"] : ["text"]
        }));
        
        const providers = [...new Set(allModels.map(m => m.provider))].sort();
        UI.provider.forEach(select => {
          providers.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p; opt.textContent = p.toUpperCase();
            select.appendChild(opt);
          });
        });

        applyFilters();
      } catch (err) { console.error(err); }
    }

    function applyFilters() {
      // Sync Mobile and Desktop values
      const query = (UI.search[0].value || UI.search[1].value).toLowerCase();
      const prov = UI.provider[0].value || UI.provider[1].value;
      const sortBy = UI.sort[0].value || UI.sort[1].value;
      const isText = UI.text[0].checked || UI.text[1].checked;
      const isImage = UI.image[0].checked || UI.image[1].checked;

      filteredModels = allModels.filter(m => {
        const matchesProvider = !prov || m.provider === prov;
        const matchesText = !isText || m.input.includes("text");
        const matchesImage = !isImage || m.input.includes("image");
        const matchesSearch = !query || m.name.toLowerCase().includes(query) || m.id.toLowerCase().includes(query);
        return matchesProvider && matchesText && matchesImage && matchesSearch;
      });

      filteredModels.sort((a, b) => {
        let res = 0;
        if (sortBy === 'name') res = a.name.localeCompare(b.name);
        else if (sortBy === 'context') res = a.contextWindow - b.contextWindow;
        else if (sortBy === 'provider') res = a.provider.localeCompare(b.provider);
        return sortAsc ? res : -res;
      });

      currentPage = 1;
      render();
    }

    function render() {
      UI.list.innerHTML = "";
      if(UI.stats) {
        UI.stats.innerHTML = `
          <div class="flex justify-between text-xs font-medium"><span class="text-gray-600">NODES</span><span class="text-white">${allModels.length}</span></div>
          <div class="flex justify-between text-xs font-medium"><span class="text-gray-600">ACTIVE</span><span class="text-red-500 font-bold">${filteredModels.length}</span></div>
        `;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const pageItems = filteredModels.slice(start, start + itemsPerPage);

      pageItems.forEach(m => {
        const card = document.createElement("div");
        card.className = "model-card p-4 lg:p-6 flex flex-col justify-between cursor-pointer group";
        card.onclick = () => copyId(m.id);
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
               <span class="text-[7px] lg:text-[9px] mono font-bold text-gray-500 uppercase">${m.provider}</span>
               ${m.reasoning ? '<span class="w-1.5 h-1.5 rounded-full bg-red-600 shadow-[0_0_8px_#ff3e3e]"></span>' : ''}
            </div>
            <h2 class="text-xs lg:text-base font-bold text-white group-hover:text-red-500 transition-colors truncate uppercase">${m.name}</h2>
            <p class="text-[8px] lg:text-[10px] mono text-gray-700 truncate mt-1 italic">${m.id}</p>
          </div>
          <div class="flex items-end justify-between border-t border-white/5 mt-4 pt-3">
            <span class="text-[9px] lg:text-xs font-bold text-gray-400">${(m.contextWindow/1000).toFixed(0)}K</span>
            <span class="text-[8px] lg:text-[10px] font-bold text-white/10 uppercase group-hover:text-white/40 transition-colors">${m.input[0]}</span>
          </div>
        `;
        UI.list.appendChild(card);
      });

      renderPaginationControls();
    }

    function renderPaginationControls() {
      const totalPages = Math.ceil(filteredModels.length / itemsPerPage);
      UI.pageInfo.textContent = `SEG ${currentPage} / ${totalPages || 1}`;
      UI.dots.innerHTML = "";
      
      const start = Math.max(1, currentPage - 1);
      const end = Math.min(totalPages, start + 3);

      for (let i = start; i <= end; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = `w-9 h-9 flex-shrink-0 rounded-lg text-xs font-bold transition-all ${currentPage === i ? 'bg-red-600 text-white' : 'text-gray-600 hover:text-white hover:bg-white/5'}`;
        btn.onclick = () => { currentPage = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        UI.dots.appendChild(btn);
      }
    }

    [...UI.search, ...UI.provider, ...UI.sort, ...UI.text, ...UI.image].forEach(el => {
      el.addEventListener(el.type === 'checkbox' ? 'change' : (el.tagName === 'SELECT' ? 'change' : 'input'), applyFilters);
    });

    fetchData();
  </script>
</body>
</html>
